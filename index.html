<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#13191e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Mobile Combat Prototype</title>
  <meta name="description" content="A simple mobile combat prototype with full-body 360-degree movement, aiming and shooting.">
  <meta name="application-name" content="Mobile Combat Prototype">
  <meta name="apple-mobile-web-app-title" content="Mobile Combat Prototype">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
  <canvas id="game" aria-label="3D isometric weapon test arena"></canvas>
  <header>
    <div><strong>MOBILE COMBAT</strong><small>LEFT AIM / 13</small></div>
    <div id="status" aria-live="polite">RIFLE · 30 / 30</div>
    <button id="reset">Reset</button>
  </header>
  <div id="stats">Hits 0 · Shots 0 · Accuracy —</div>
  <div id="feedback" aria-live="polite"></div>
  <div class="options"><button id="assist" aria-pressed="true">Assist: Light</button><button id="sound" aria-pressed="true">Sound: ON</button><button id="fullscreen">Full screen</button></div>
  <div class="stick" id="move" role="group" aria-label="Movement and targeting joystick"><span class="stick-label">MOVE + AIM</span><div class="knob"></div></div>
  <div id="aim-overlays"><div id="aim-edge" class="hidden" aria-hidden="true">➤</div>
  <div id="target-marker" class="hidden" aria-hidden="true">▼</div>
  <div id="hit-marker" aria-hidden="true">×</div></div>
  <div id="look-hint">FIRE ONLY</div>
  <button class="fire fire-right" id="fire-right" aria-label="Fire; hold to shoot"><svg class="reload-ring" viewBox="0 0 100 100" aria-hidden="true"><circle id="reload-ring" cx="50" cy="50" r="47" pathLength="100"/></svg><span id="fire-label">FIRE</span><small id="fire-hint">HOLD TO FIRE</small></button>
  <div class="actions"><button id="reload">RELOAD</button><button id="swap">PISTOL</button></div>
  <div id="hint">Left stick moves + aims · Nearby targets stay assisted<br>Hold FIRE to shoot</div>
  <div id="welcome" class="hidden" role="alert"></div>
  <script type="module" src="./src/main.js?v=combat-13"></script>
</body>
</html>

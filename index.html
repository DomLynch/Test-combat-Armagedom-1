<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#13191e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>ARMAGEDOM · Combat lab</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
  <canvas id="game" aria-label="3D isometric weapon test arena"></canvas>
  <header>
    <div><strong>COMBAT LAB</strong><small>TWO THUMBS / 05</small></div>
    <div id="status" aria-live="polite">RIFLE · 30 / 30</div>
    <button id="reset">Reset</button>
  </header>
  <div id="stats">Hits 0 · Shots 0 · Accuracy —</div>
  <div id="feedback" aria-live="polite"></div>
  <div class="options"><button id="sensitivity" aria-label="Cycle aim sensitivity">Aim: Normal</button><button id="sound" aria-pressed="true">Sound: ON</button><button id="fullscreen">Full screen</button></div>
  <div class="stick" id="move" role="group" aria-label="Movement joystick"><span class="stick-label">MOVE</span><div class="knob"></div></div>
  <div id="aim-edge" class="hidden" aria-hidden="true">➤</div>
  <div id="hit-marker" aria-hidden="true">×</div>
  <div id="look-hint">SWIPE TO AIM</div>
  <button class="fire fire-right" id="fire-right" aria-label="Fire; hold and drag to aim"><svg class="reload-ring" viewBox="0 0 100 100" aria-hidden="true"><circle id="reload-ring" cx="50" cy="50" r="47" pathLength="100"/></svg><span id="fire-label">FIRE</span><small id="fire-hint">HOLD + DRAG</small></button>
  <div class="actions"><button id="reload">RELOAD</button><button id="swap">PISTOL</button></div>
  <div id="hint">Left stick moves · Swipe right side to aim<br>Hold + drag FIRE to shoot and aim</div>
  <div id="welcome" class="hidden" role="alert"></div>
  <script type="module" src="./src/main.js?v=combat-5"></script>
</body>
</html>

# Independent Combat Lab. Only degree-choice.com; no main-game includes.
server {
    listen 80;
    listen [::]:80;
    server_name degree-choice.com www.degree-choice.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/degree-choice-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://degree-choice.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.degree-choice.com;
    ssl_certificate /etc/letsencrypt/live/degree-choice.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/degree-choice.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / { return 308 https://degree-choice.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name degree-choice.com;
    ssl_certificate /etc/letsencrypt/live/degree-choice.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/degree-choice.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/test-combat-armagedom-1/current;
    index index.html;
    types {
        text/html html;
        text/css css;
        application/javascript js;
        application/json json;
        application/manifest+json webmanifest;
        text/plain txt;
    }
    gzip on;
    gzip_types application/javascript text/css application/json application/manifest+json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Permissions-Policy "fullscreen=(self)" always;
    location = / { try_files /index.html =404; }
    location = /armagedom { return 410; }
    location ^~ /armagedom/ { return 410; }
    location ~ /\. { return 404; }
    location / { try_files $uri =404; }
}
